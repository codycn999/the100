<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE 100 · 影响人类历史进程的100名人</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.2/dist/d3.min.js" integrity="sha384-LxfWGZyh6PaLjBRPf7NWiEYs9Mn0UQ6ZmqbLLZhxlOBBNWF2a2K0Pfc5efkrNnhQ" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson@3.0.2/dist/topojson.min.js" integrity="sha384-9dCJK6nh7skY14HrcvlLYlFga9/MehJjL9ONWRflmiXNRuf8p2jiF4Y5PR881PTq" crossorigin="anonymous"></script>
<script src="periods.js?v=d92911f"></script>
<script src="role-colors.js?v=77a7433"></script>
<script src="data.js?v=25a15a8"></script>
<script src="portrait-positions.js?v=3340ab6"></script>
<script src="content.js?v=7a1765a"></script>
<style>
@font-face {
  font-family: "DM Serif Display";
  src: url("fonts/dm-serif-display-latin-400.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}

/* ── Design tokens ── */
:root {
  --header-h: 52px;
  --bg: #0a0d13;
  --surface-1: #10141c;
  --surface-2: #161b25;
  --surface-3: #1e2430;
  --glass: rgba(16, 20, 28, .74);
  --line: #252c39;
  --line-soft: #1a202b;
  --text: #e8ecf2;
  --text-2: #a7b0bf;
  --text-3: #6c7686;
  --accent: #7cb0ff;
  --accent-bg: rgba(124, 176, 255, .14);
  --accent-line: rgba(124, 176, 255, .45);
  --gold: #e6c27a;
  --gold-bg: rgba(230, 194, 122, .12);
  --nature: #52a8e0;
  --spirit: #9a6cd0;
  --society: #e5823c;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 10px 32px rgba(0, 0, 0, .45), 0 2px 6px rgba(0, 0, 0, .3);
  --ease: cubic-bezier(.4, 0, .2, 1);
  --font-sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #343c4c; }

/* ── Header ── */
#header {
  flex: 0 0 var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 20px;
  background: var(--surface-1);
  border-bottom: 1px solid var(--line-soft);
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
#header h1 {
  font-family: var(--font-display);
  font-size: 25px; font-weight: 400; line-height: 1;
  letter-spacing: .01em; color: var(--gold);
  white-space: nowrap;
}
#header .subtitle {
  font-size: 12.5px; color: var(--text-2); letter-spacing: .02em;
  padding-left: 14px; border-left: 1px solid var(--line);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.legend { display: flex; gap: 10px; align-items: center; }
.legend-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; color: var(--text-2); cursor: pointer; transition: color .2s;
}
.legend-item:hover { color: var(--text); }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; }

/* ── Map ── */
#map-container {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  min-height: 0;
  background: radial-gradient(ellipse 70% 60% at 50% 45%, #101828 0%, var(--bg) 100%);
}
#map-svg { width: 100%; height: 100%; display: block; cursor: grab; }
#map-svg:active { cursor: grabbing; }

.country { fill: #1b2436; stroke: #2a3550; stroke-width: 0.4; }
.graticule { fill: none; stroke: rgba(148, 163, 184, .07); stroke-width: 0.4; }
.sphere { fill: #0b1422; stroke: rgba(148, 163, 184, .14); stroke-width: 1; }
.person-dot { cursor: pointer; transition: opacity .2s; }
.person-dot:hover { opacity: 1 !important; }
.person-label { font-size: 7px; pointer-events: none; fill: var(--bg); font-weight: 700;
  text-anchor: middle; dominant-baseline: middle; }

/* ── Floating toolbars (map overlays) ── */
.toolbar {
  display: flex; align-items: center; gap: 2px;
  padding: 3px;
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backdrop-filter: blur(12px) saturate(140%);
  -webkit-backdrop-filter: blur(12px) saturate(140%);
  box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}
.toolbar-label, .filter-label, #map-color-btns .cmode-label {
  font-size: 11px; color: var(--text-3); letter-spacing: .08em;
  padding: 0 6px 0 7px; white-space: nowrap; user-select: none;
}
.fit-btn, .filter-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--text-2);
  font-size: 12px; line-height: 1;
  padding: 6px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.fit-btn:hover, .filter-btn:hover { background: var(--surface-3); color: var(--text); }
.fit-btn.active, .filter-btn.active {
  background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent);
}
.filter-btn[data-value="Nature"].active  { background: rgba(82,168,224,.16);  border-color: rgba(82,168,224,.5);  color: var(--nature); }
.filter-btn[data-value="Spirit"].active  { background: rgba(154,108,208,.18); border-color: rgba(154,108,208,.55); color: #b391e0; }
.filter-btn[data-value="Society"].active { background: rgba(229,130,60,.16);  border-color: rgba(229,130,60,.5);  color: var(--society); }

#map-fit-btns, #map-color-btns {
  position: absolute; bottom: 14px; z-index: 20;
}
#map-fit-btns { right: 14px; }
#map-color-btns { left: 14px; }
#map-filters {
  position: absolute; top: 14px; left: 14px; z-index: 20;
  display: flex; flex-direction: column; gap: 6px;
  max-width: calc(100% - 28px);
}
.filter-row { overflow-x: auto; scrollbar-width: none; }
.filter-row::-webkit-scrollbar { display: none; }

/* ── Timeline ── */
#timeline {
  position: relative;
  flex: 0 0 auto;
  background: var(--surface-1);
  border-top: 1px solid var(--line-soft);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: height .3s var(--ease);
}
#tl-controls {
  flex: 0 0 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  min-width: 0;
}
#era-buttons {
  display: flex; gap: 2px; padding: 3px;
  background: var(--bg); border: 1px solid var(--line-soft); border-radius: var(--radius);
  overflow-x: auto; scrollbar-width: none; flex: 0 1 auto; min-width: 0;
}
#era-buttons::-webkit-scrollbar { display: none; }
.era-btn {
  background: transparent;
  border: 1px solid transparent;
  border-radius: 7px;
  color: var(--text-2);
  font-size: 12px; line-height: 1;
  padding: 6px 11px;
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
  white-space: nowrap;
}
.era-btn:hover { background: var(--surface-3); color: var(--text); }
.era-btn.active { background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent); }
/* A two-era selection highlights the whole range, including the eras in between. */
.era-btn.range-start, .era-btn.range-mid, .era-btn.range-end {
  background: var(--accent-bg); border-color: var(--accent-line); color: var(--accent);
}
.era-btn.range-start { border-top-right-radius: 3px; border-bottom-right-radius: 3px; }
.era-btn.range-mid { border-radius: 3px; }
.era-btn.range-end { border-top-left-radius: 3px; border-bottom-left-radius: 3px; }

#yr-range {
  display: none;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-3);
  flex: 0 0 auto;
}
#yr-range input {
  width: 72px; padding: 5px 8px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--radius-sm); color: var(--text); font-size: 12px;
  font-family: inherit; font-variant-numeric: tabular-nums;
}
#yr-range input:focus { outline: none; border-color: var(--accent); }
.yr-sep { color: var(--text-3); }
#yr-apply {
  background: var(--accent-bg); border: 1px solid var(--accent-line);
  border-radius: var(--radius-sm); color: var(--accent); font-size: 12px;
  padding: 5px 10px; cursor: pointer;
}
#yr-apply:hover { background: rgba(124,176,255,.24); }

#tl-mode-info {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--text-3);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

#tl-svg-wrap {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}
#timeline-svg { display: block; width: 100%; }
#timeline-head-svg { display: block; width: 100%; flex: 0 0 auto; }
#tl-svg-wrap { min-height: 0; }
#tl-resize-handle {
  position: absolute; top: 0; left: 0; right: 0; height: 9px; z-index: 30;
  cursor: ns-resize; touch-action: none;
}
#tl-resize-handle::after {
  content: ''; position: absolute; top: 2px; left: 50%; width: 44px; height: 4px;
  margin-left: -22px; border-radius: 2px; background: var(--line);
  transition: background .15s, width .15s, margin-left .15s;
}
#tl-resize-handle:hover::after, #tl-resize-handle:focus-visible::after,
body.resizing-timeline #tl-resize-handle::after { background: var(--accent); width: 72px; margin-left: -36px; }
#tl-resize-handle:focus-visible { outline: none; }
body.resizing-timeline, body.resizing-timeline * { cursor: ns-resize !important; user-select: none !important; }
body.resizing-timeline #timeline { transition: none; }

/* Timeline SVG parts */
.tl-plot { fill: var(--bg); stroke: var(--line-soft); stroke-width: 1; }
.tl-band-alt { fill: rgba(148, 163, 184, .045); }
.tl-band-sep { stroke: rgba(148, 163, 184, .1); stroke-width: 1; }
.tl-era-label { fill: var(--text-2); font-size: 11px; font-weight: 600; letter-spacing: .12em; }
.tl-axis { stroke: var(--line); stroke-width: 1; }
.tl-tick { stroke: #3a4354; stroke-width: 1; }
.tl-tick-label { fill: var(--text-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.tl-grid { stroke: rgba(148, 163, 184, .06); stroke-width: 1; }
.tl-lane { stroke-width: 1; stroke-dasharray: 2 4; opacity: .28; }
.tl-row-sep { stroke: rgba(148, 163, 184, .045); stroke-width: 1; }
.tl-bar-label { font-size: 10px; font-weight: 600; fill: var(--bg); pointer-events: none; }
.tl-bar-label-out { font-size: 10px; fill: var(--text-2); pointer-events: none; }
.tl-bar-rank { font-size: 9px; fill: var(--bg); opacity: .7; pointer-events: none; font-variant-numeric: tabular-nums; }

.tl-dot { cursor: pointer; transition: r .15s; }
.tl-dot:hover { opacity: 1 !important; }
.tl-bar { cursor: pointer; }
.tl-bar:hover { opacity: 1 !important; }

/* Auxiliary historical periods */
.tl-period-tint { opacity: .045; pointer-events: none; transition: opacity .15s; }
.tl-period-tint.hot { opacity: .18; }
.tl-period { cursor: pointer; outline: none; }
.tl-period rect { fill-opacity: .22; stroke-opacity: .55; stroke-width: 1; transition: fill-opacity .15s, stroke-opacity .15s; }
.tl-period:hover rect, .tl-period:focus-visible rect { fill-opacity: .42; stroke-opacity: 1; }
.tl-period:focus-visible rect { stroke-width: 2; }
.tl-period text { font-size: 10px; font-weight: 600; pointer-events: none; }
.tl-toggle {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid var(--line); border-radius: 8px;
  color: var(--text-3); font-size: 12px; line-height: 1; padding: 7px 11px; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.tl-toggle::before {
  content: ''; width: 8px; height: 8px; border-radius: 2px;
  background: linear-gradient(90deg, #8fa8ff 0 25%, #e6c27a 0 50%, #4fd1c5 0 75%, #ef7d7d 0);
  opacity: .45;
}
.tl-toggle:hover { background: var(--surface-3); color: var(--text); }
.tl-toggle[aria-pressed="true"] { color: var(--text); border-color: #343c4c; background: var(--surface-2); }
.tl-toggle[aria-pressed="true"]::before { opacity: 1; }
.period-legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.period-legend[hidden] { display: none; }
.period-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
#tooltip .tt-period-cat { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
#tooltip .tt-period-cat i { width: 8px; height: 8px; border-radius: 2px; }
#tooltip .tt-note { margin-top: 6px; color: #cdd5e0; font-size: 12px; line-height: 1.6; }
#tooltip .tt-people { display: block; color: var(--text-2); line-height: 1.6; }
#tooltip .tt-hint { margin-top: 4px; font-size: 10.5px; color: var(--text-3); }

/* ── Detail Panel ── */
#detail-panel {
  position: fixed;
  top: var(--header-h); right: 0; width: var(--detail-width, 400px); bottom: 0;
  max-width: calc(100vw - 24px);
  transform: translateX(calc(100% + 24px));
  visibility: hidden;
  background: var(--surface-1);
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column;
  transition: transform .35s var(--ease), visibility .35s;
  z-index: 100;
  box-shadow: -16px 0 48px rgba(0, 0, 0, .5);
}
#detail-panel.open { transform: translateX(0); visibility: visible; }
#detail-resize-handle {
  position: absolute; left: -6px; top: 0; bottom: 0; width: 12px;
  cursor: ew-resize; touch-action: none; z-index: 1;
}
#detail-resize-handle::after {
  content: ''; position: absolute; left: 4px; top: 50%;
  width: 4px; height: 44px; border-radius: 2px; background: var(--line);
  transform: translateY(-50%); transition: background .15s, height .15s;
}
#detail-resize-handle:hover::after, #detail-resize-handle:focus-visible::after {
  background: var(--accent); height: 64px;
}
#detail-resize-handle:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
body.resizing-detail, body.resizing-detail * { cursor: ew-resize !important; user-select: none !important; }
#detail-header {
  padding: 22px 52px 18px 24px; flex: 0 0 auto;
  border-bottom: 1px solid var(--line-soft);
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface-1) 100%);
}
#detail-rank {
  font-family: var(--font-display);
  font-size: 15px; color: var(--gold); letter-spacing: .02em; margin-bottom: 2px;
}
#detail-name-zh { font-size: 24px; font-weight: 700; letter-spacing: .02em; line-height: 1.3; }
#detail-name-en { font-size: 14px; color: var(--text-2); margin-top: 2px; }
#detail-dates   { font-size: 12.5px; color: var(--text-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
#detail-region  { display: inline-block; margin-top: 8px; padding: 2px 10px;
  border-radius: 12px; font-size: 11px; font-weight: 500; }
#detail-body {
  flex: 1 1 auto; overflow-y: auto; padding: 20px 24px 28px; scroll-behavior: smooth;
}
.para-block { margin-bottom: 4px; }
.para-en { font-size: 13px; line-height: 1.75; color: var(--text-3); }
.para-zh { font-size: 15px; line-height: 1.9; color: #d5dbe4; margin-top: 8px; letter-spacing: .01em; }
.para-divider { border: none; border-top: 1px solid var(--line-soft); margin: 18px 0; }
#detail-links {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 14px 24px; border-top: 1px solid var(--line-soft); flex: 0 0 auto;
  background: var(--surface-1);
}
#detail-links:empty { display: none; }
#detail-links a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; color: var(--accent); font-size: 12.5px; text-decoration: none;
  transition: background .15s, border-color .15s;
}
#detail-links a:hover { background: var(--surface-3); border-color: var(--accent-line); }
#close-btn {
  position: absolute; top: 16px; right: 16px; z-index: 2;
  width: 32px; height: 32px; display: grid; place-items: center;
  background: transparent; border: 1px solid transparent; color: var(--text-2); cursor: pointer;
  font-size: 15px; line-height: 1; border-radius: 50%;
  transition: background .15s, color .15s, border-color .15s;
}
#close-btn:hover { background: var(--surface-3); border-color: var(--line); color: var(--text); }

/* ── Tooltip ── */
#tooltip {
  position: fixed;
  background: rgba(20, 25, 34, .94); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; pointer-events: auto; font-size: 12px; line-height: 1.5;
  z-index: 200; display: none; max-width: 260px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: var(--shadow);
}
#tooltip .tt-rank { color: var(--gold); font-size: 11px; font-family: var(--font-display); letter-spacing: .02em; }
#tooltip .tt-zh   { font-size: 15px; font-weight: 600; }
#tooltip .tt-en   { color: var(--text-2); font-size: 11.5px; }
#tooltip .tt-date { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.tt-header { display: flex; gap: 12px; align-items: center; }
.tt-portrait { width: 52px; height: 52px; flex: 0 0 52px; border-radius: 8px; }
.tt-info { min-width: 0; }
.tt-meta { margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line-soft);
  display: flex; gap: 8px; align-items: center; font-size: 11px; }

/* ── Region filter (header right) ── */
#region-filter { position: relative; display: flex; align-items: center; flex: 0 0 auto; }
#region-filter-btn {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  color: var(--text-2); font-size: 12.5px; padding: 5px 6px 5px 12px; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
#region-filter-btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
#region-filter-btn:hover { background: var(--surface-3); color: var(--text); }
#region-filter-btn.has-selection { border-color: var(--accent-line); color: var(--accent); }
.count-badge {
  background: var(--accent-bg); color: var(--accent); border-radius: 999px;
  padding: 3px 9px; font-size: 11px; font-weight: 600; min-width: 22px;
  text-align: center; transition: background .2s; white-space: nowrap;
}

#region-dropdown {
  position: absolute; top: 100%; right: 0; margin-top: 8px;
  background: rgba(20, 25, 34, .96); border: 1px solid var(--line); border-radius: 12px;
  min-width: 220px; max-height: min(460px, calc(100dvh - var(--header-h) - 24px)); overflow-y: auto;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow);
  z-index: 50; padding: 6px; display: flex; flex-direction: column;
}
#region-dropdown.hidden { display: none; }

.reg-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; cursor: pointer; transition: background .12s;
  font-size: 12.5px; color: #cdd5e0; user-select: none; border-radius: 7px;
}
.reg-item:hover { background: var(--surface-3); }
.reg-item input[type="checkbox"] {
  accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0;
}
.reg-item-all {
  border-bottom: 1px solid var(--line-soft); padding-bottom: 8px; margin-bottom: 4px;
  border-radius: 7px 7px 0 0; font-weight: 600; color: var(--text);
}
.reg-continent {
  font-weight: 600; font-size: 12.5px; padding: 7px 10px 4px;
  color: var(--text-2); margin-top: 2px;
}
.reg-continent input { accent-color: var(--text-3); }
.reg-sub {
  padding: 5px 10px 5px 32px; font-size: 12px;
}
.reg-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}

/* ── Map country emphasis ── */
.country { transition: fill .5s ease, opacity .5s ease; }

/* ── Detail portrait ── */
#detail-portrait {
  width: 88px; height: 88px; border-radius: 12px;
  flex: 0 0 88px;
}
.detail-portrait-tools { display: flex; flex: 0 0 88px; flex-direction: column; align-items: center; gap: 6px; }
.portrait-tool-row { display: flex; gap: 2px; justify-content: center; }
.portrait-refresh {
  padding: 4px 7px; border: 1px solid transparent; border-radius: 6px; background: transparent;
  color: var(--text-3); font: inherit; font-size: 11.5px; cursor: pointer; white-space: nowrap;
  transition: background .15s, color .15s;
}
.portrait-refresh:hover { color: var(--text); background: var(--surface-3); }
.portrait-refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.portrait-refresh[hidden] { display: none; }
#portrait-menu {
  position: fixed; z-index: 300; padding: 4px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--surface-2); box-shadow: var(--shadow);
}
#portrait-menu button { display: block; width: 100%; text-align: left; color: var(--text); padding: 7px 12px; font-size: 12.5px; }
#portrait-menu button[hidden] { display: none; }
.person-portrait {
  position: relative; overflow: hidden; background: var(--surface-2);
  border: 1px solid var(--line);
}
button.person-portrait { padding: 0; color: inherit; font: inherit; }
button.person-portrait:not(:disabled) { cursor: zoom-in; }
button.person-portrait:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.person-portrait img {
  position: relative; display: block; width: 100%; height: 100%; object-fit: cover;
}
.person-portrait .avatar-fallback {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700;
}
#detail-header-top {
  display: flex; gap: 16px; align-items: flex-start;
}
#detail-header-text { flex: 1 1 auto; min-width: 0; padding-top: 2px; }
#detail-name-zh, #detail-name-en { overflow-wrap: anywhere; }

/* ── Dialogs ── */
#portrait-dialog, #portrait-crop-dialog {
  margin: auto; border: 1px solid var(--line); border-radius: var(--radius-lg);
  background: var(--surface-1); color: var(--text); box-shadow: var(--shadow);
}
#portrait-dialog::backdrop, #portrait-crop-dialog::backdrop {
  background: rgba(4, 6, 10, .78); backdrop-filter: blur(4px);
}
#portrait-dialog {
  padding: 20px;
  max-width: calc(100vw - 32px); max-height: calc(100dvh - 32px);
}
#portrait-dialog figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#portrait-full-image { display: block; max-width: 100%; max-height: calc(100dvh - 120px); object-fit: contain; border-radius: 8px; }
#portrait-caption { padding: 0 32px; font-size: 14px; text-align: center; color: var(--text-2); }
#portrait-close {
  position: absolute; top: 10px; right: 10px; z-index: 1;
  width: 34px; height: 34px; display: grid; place-items: center;
  background: rgba(20, 25, 34, .8); border: 1px solid var(--line); border-radius: 50%;
  color: var(--text); font-size: 15px; cursor: pointer;
}
#portrait-close:hover { background: var(--surface-3); }
#portrait-error { padding: 20px; color: #f0b86e; font-size: 13px; }
#portrait-actions { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 8px; }
#portrait-status { color: var(--text-3); font-size: 12px; }

/* ── Portrait crop editor ── */
#portrait-crop-dialog {
  padding: 22px; width: min(380px, calc(100vw - 24px));
  max-height: calc(100dvh - 24px); overflow-y: auto;
}
#portrait-crop-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
#portrait-crop-help, #portrait-crop-status { font-size: 12px; color: var(--text-2); margin: 8px 0; line-height: 1.6; }
#portrait-crop-preview {
  position: relative; width: 100%; aspect-ratio: 1; overflow: hidden;
  border-radius: 10px; background: var(--bg); outline: 1px solid var(--line);
  cursor: grab; touch-action: none; user-select: none;
}
#portrait-crop-preview.dragging { cursor: grabbing; }
#portrait-crop-preview:focus-visible { outline: 2px solid var(--accent); }
#portrait-crop-image { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
#portrait-crop-image[hidden] { display: none; }
#portrait-crop-position-label { display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; font-size: 12px; color: var(--text-2); }
#portrait-crop-position { flex: 1; min-width: 0; accent-color: var(--accent); }
#portrait-crop-dialog label { font-size: 12px; color: var(--text-2); }
#portrait-crop-value { width: 60px; padding: 5px 6px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-sm); }
#portrait-crop-admin { display: block; margin: 12px 0 4px; }
#portrait-crop-token { display: block; width: 100%; margin-top: 6px; padding: 9px 10px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; }
#portrait-crop-token:focus, #portrait-crop-value:focus { outline: none; border-color: var(--accent); }
#portrait-crop-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 4px; }
#portrait-crop-actions .portrait-refresh { padding: 7px 12px; font-size: 12.5px; color: var(--text-2); }
#portrait-crop-save.portrait-refresh { background: #2f6fde; color: #fff; }
#portrait-crop-save.portrait-refresh:hover { background: #3b7cf0; }
#portrait-crop-actions button:disabled { opacity: .45; cursor: default; }

/* ── Tag pills ── */
.tag-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tag-pill {
  padding: 3px 10px; border-radius: 999px; font-size: 11.5px; line-height: 1.5;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2);
}
.tag-pill.domain-Nature  { border-color: rgba(82,168,224,.32);  color: var(--nature); background: rgba(82,168,224,.1); }
.tag-pill.domain-Spirit  { border-color: rgba(154,108,208,.36); color: #b391e0;       background: rgba(154,108,208,.12); }
.tag-pill.domain-Society { border-color: rgba(229,130,60,.32);  color: var(--society); background: rgba(229,130,60,.1); }
.tag-pill.country-tag { font-size: 11px; color: var(--text-3); }

/* ── Loading ── */
#loading {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; z-index: 999;
  font-size: 13px; color: var(--text-3); letter-spacing: .06em;
}
.loading-brand { font-family: var(--font-display); font-size: 40px; color: var(--gold); letter-spacing: .01em; }
.spinner {
  width: 26px; height: 26px; border: 2px solid var(--line);
  border-top-color: var(--gold); border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

#map-svg { touch-action: none; }
.person-dot:focus, .tl-dot:focus, .tl-bar:focus { stroke: #fff; stroke-width: 3px; outline: none; }
#map-error {
  padding: 8px 16px; color: #f0b86e; font-size: 13px;
  background: rgba(240,184,110,.08); border-bottom: 1px solid rgba(240,184,110,.25);
}
#map-retry {
  margin-left: 8px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
  background: transparent; border: 1px solid rgba(240,184,110,.5); color: #f0b86e;
}
.para-en, .para-zh { white-space: pre-wrap; }

@media (max-width: 720px) {
  #header { padding: 0 14px; gap: 10px; }
  #header h1 { font-size: 23px; }
  #header .subtitle { font-size: 12px; padding-left: 10px; }
  #tl-controls { padding: 0 10px; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #tl-controls::-webkit-scrollbar { display: none; }
  #tl-controls > * { flex-shrink: 0; }
  #tl-mode-info { display: none; }
  .period-legend { display: none !important; }
  #map-filters { top: 10px; left: 10px; max-width: calc(100% - 20px); }
  #map-fit-btns { right: 10px; bottom: 10px; }
  #map-color-btns { left: 10px; bottom: 10px; }
  .fit-btn, .filter-btn { padding: 6px 8px; }
  .toolbar-label, .filter-label, #map-color-btns .cmode-label { padding: 0 3px 0 5px; }
}
@media (max-width: 600px) {
  #detail-panel { width: 100%; max-width: none; }
  #detail-resize-handle { display: none; }
  #detail-header { padding: 18px 52px 14px 18px; }
  #detail-body { padding: 16px 18px 24px; }
  #detail-links { padding: 12px 18px; }
}
@media (max-width: 480px) {
  #header .subtitle { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>
</head>

// Mix a hex color toward white (positive amount) or black (negative) to
// brighten/darken it. amount in roughly [-1, 1].
function lightenColor(hex, amount) {
  const c = hex.replace('#', '');
  const n = parseInt(c.length === 3 ? c.split('').map(x => x + x).join('') : c, 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
  const mix = v => clamp(amount >= 0 ? v + (255 - v) * amount : v * (1 + amount));
  return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
}

// ── Historical periods ─────────────────────────────────────────
// Auxiliary, possibly overlapping periods from periods.js. Each visible period
// tints the plot background and gets a labeled capsule in a strip near the axis.
const PERIOD_ROW_H = 15;         // px per capsule row
const PERIOD_BAR_H = 12;         // capsule height
const PERIOD_MAX_ROWS = 3;       // rows in wide views; extra overlapping periods are left out
const PERIOD_MAX_ROWS_ZOOMED = 4; // rows when the view spans ≤ PERIOD_TIER2_SPAN years
const PERIOD_TIER2_SPAN = 2500;  // tier-2 periods appear when the view spans ≤ this many years
const PERIOD_MIN_W = 4;          // px, so short events (wars, plagues) stay visible
let periodsVisible = (() => {
  try { return localStorage.getItem('the100:periods') !== 'off'; } catch { return true; }
})();
let refreshEraButtons = () => {};  // set by buildTimeline()

function allPeriods() { return typeof PERIODS === 'undefined' ? [] : PERIODS; }
function periodLabelWidth(text) {
  let w = 0;
  for (const ch of text) w += ch.charCodeAt(0) > 255 ? 10.5 : 6;
  return w;
}
function periodYears(p) {
  return `${p.approx ? '约 ' : ''}${formatYear(p.start)} — ${p.ongoing ? '至今' : formatYear(p.end)}`;
}

// Pure layout: choose the periods visible in [start, end] and pack overlapping
// ones into rows (tier 1 first, then by start year).
function layoutPeriods(periods, start, end, xScale, maxRows = PERIOD_MAX_ROWS) {
  const span = end - start;
  const candidates = periods
    .filter(p => p.end >= start && p.start <= end && (p.tier === 1 || span <= PERIOD_TIER2_SPAN))
    .sort((a, b) => a.tier - b.tier || a.start - b.start);
  const rows = [];
  const items = [];
  for (const period of candidates) {
    const x1 = xScale(Math.max(period.start, start));
    const x2 = Math.max(xScale(Math.min(period.end, end)), x1 + PERIOD_MIN_W);
    const showLabel = x2 - x1 >= periodLabelWidth(period.zh) + 10;
    const fits = row => row.every(([a, b]) => x2 + 2 <= a || x1 >= b + 2);
    let row = rows.findIndex(fits);
    if (row === -1) {
      if (rows.length >= maxRows) continue;
      row = rows.push([]) - 1;
    }
    rows[row].push([x1, x2]);
    items.push({ period, x1, x2, row, showLabel });
  }
  return { items, rows: rows.length };
}

function periodMaxRows(start, end) {
  return end - start <= PERIOD_TIER2_SPAN ? PERIOD_MAX_ROWS_ZOOMED : PERIOD_MAX_ROWS;
}

function periodStripHeight(layout) {
  return layout.rows ? layout.rows * PERIOD_ROW_H + 4 : 0;
}

// Faint full-height background for each visible period. Drawn in both the fixed
// head and the scrolling body so a period reads as one continuous column.
function drawPeriodTints(svg, layout, top, bottom) {
  if (!layout.items.length || bottom <= top) return;
  svg.append('g').attr('class', 'tl-period-tints')
    .selectAll('.tl-period-tint').data(layout.items).join('rect')
    .attr('class', 'tl-period-tint')
    .attr('x', d => d.x1).attr('y', top)
    .attr('width', d => d.x2 - d.x1).attr('height', bottom - top)
    .attr('fill', d => PERIOD_CATEGORIES[d.period.cat].color);
}

function highlightPeriod(item) {
  d3.selectAll('.tl-period-tint').classed('hot', t => t === item);
}

// Labeled capsules, packed into rows starting at stripY.
function drawPeriodStrip(svg, layout, stripY) {
  if (!layout.items.length) return;
  const color = d => PERIOD_CATEGORIES[d.period.cat].color;
  const caps = svg.append('g').attr('class', 'tl-periods')
    .selectAll('.tl-period').data(layout.items).join('g')
    .attr('class', 'tl-period')
    .attr('transform', d => `translate(${d.x1},${stripY + d.row * PERIOD_ROW_H})`)
    .attr('tabindex', 0).attr('role', 'button')
    .attr('aria-label', d => `${d.period.zh}，${periodYears(d.period)}。按回车聚焦此时段`)
    .on('mouseenter', (evt, d) => { highlightPeriod(d); showPeriodTip(evt, d.period); })
    .on('mousemove', moveTip)
    .on('mouseleave', () => { highlightPeriod(null); hideTip(); })
    .on('focus', (evt, d) => highlightPeriod(d))
    .on('blur', () => highlightPeriod(null))
    .on('click', (evt, d) => { evt.stopPropagation(); focusPeriod(d.period); })
    .on('keydown', (evt, d) => {
      if (evt.key === 'Enter' || evt.key === ' ') { evt.preventDefault(); focusPeriod(d.period); }
    });
  caps.append('rect')
    .attr('width', d => d.x2 - d.x1).attr('height', PERIOD_BAR_H)
    .attr('rx', d => Math.min(PERIOD_BAR_H / 2, (d.x2 - d.x1) / 2))
    .attr('fill', color).attr('stroke', color);
  caps.filter(d => d.showLabel).append('text')
    .attr('x', 6).attr('y', PERIOD_BAR_H / 2 + 0.5)
    .attr('dominant-baseline', 'middle')
    .attr('fill', color)
    .text(d => d.period.zh);
}

// Zoom the timeline (and the map's time filter) to a period with some context.
function focusPeriod(p) {
  const last = p.ongoing ? ERA_DEFS.all.end : p.end;
  const pad = Math.max(10, Math.round((last - p.start) * 0.15));
  tlState.era = 'custom';
  tlState.start = Math.max(ERA_DEFS.all.start, Math.floor(p.start - pad));
  tlState.end = Math.min(ERA_DEFS.all.end, Math.ceil(last + pad));
  eraFirst = null; eraSecond = null;
  document.getElementById('yr-range').style.display = 'flex';
  document.getElementById('yr-start').value = tlState.start;
  document.getElementById('yr-end').value = tlState.end;

// ── Timeline frame (shared by dot and lifeline views) ───────────
// Fixed head: era labels, axis and the period strip — always visible on top.
// Body: dot lanes or lifeline bars; only the body scrolls when bars overflow.
const TL_LEFT = 20, TL_RIGHT = 16;           // plot content inset (px)
const TL_HEAD_ERA_H = 20, TL_HEAD_AXIS_H = 20;
const TL_MIN_BODY_H = 48;
const TL_HEIGHT_KEY = 'the100:tl-height';
const TL_ERA_SEGS = [
  { s: -3200, e: -500, label: '上古' },
  { s: -500,  e: 500,  label: '古典' },
  { s: 500,   e: 1400, label: '中世纪' },
  { s: 1400,  e: 1800, label: '近代' },
  { s: 1800,  e: 2030, label: '现代' },
];
// Total timeline height chosen by dragging its top edge; null = automatic.
let tlUserHeight = (() => {
  try {
    const v = parseInt(localStorage.getItem(TL_HEIGHT_KEY), 10);
    return Number.isFinite(v) && v > 0 ? v : null;
  } catch { return null; }
})();

function tlMaxHeight() {
  const vh = typeof window !== 'undefined' && window.innerHeight ? window.innerHeight : 900;
  return Math.max(160, vh - 52 - 140);  // keep ≥140px of map under the 52px header
}

// Total timeline height and the visible body height for a given head.
function resolveTimelineHeight(headH, naturalBodyH) {
  const minTotal = TL_CONTROLS_H + headH + TL_MIN_BODY_H;
  const total = tlUserHeight == null
    ? TL_CONTROLS_H + headH + naturalBodyH
    : Math.max(minTotal, Math.min(tlUserHeight, tlMaxHeight()));
  return { total, bodyH: total - TL_CONTROLS_H - headH };
}

// Round tick steps that keep labels at least minGap px apart.
function niceTicks(start, end, pxPerYear, minGap = 76) {
  const steps = [10, 25, 50, 100, 200, 250, 500, 1000, 2000];
  const step = steps.find(s => s * pxPerYear >= minGap) || 2000;
  const ticks = [];
  for (let t = Math.ceil(start / step) * step; t <= end; t += step) ticks.push(t);
  return ticks;
}
function tickLabel(t) { return t < 0 ? `BC${-t}` : t === 0 ? '公元0' : String(t); }

function roundedRectPath(x, y, w, h, rTop, rBottom) {
  return `M${x},${y + rTop}a${rTop},${rTop} 0 0 1 ${rTop},${-rTop}h${w - 2 * rTop}` +
    `a${rTop},${rTop} 0 0 1 ${rTop},${rTop}v${h - rTop - rBottom}` +
    `a${rBottom},${rBottom} 0 0 1 ${-rBottom},${rBottom}h${-(w - 2 * rBottom)}` +
    `a${rBottom},${rBottom} 0 0 1 ${-rBottom},${-rBottom}z`;
}

// Plot surface and alternating era bands for one section (head or body).
function drawTimelineSection(svg, xScale, W, top, bottom, roundTop, roundBottom, eraLabelY) {
  const left = TL_LEFT, right = W - TL_RIGHT;
  svg.append('path').attr('class', 'tl-plot')
    .attr('d', roundedRectPath(10.5, top + 0.5, Math.max(0, W - 19), Math.max(16, bottom - top - 1),
      roundTop ? 8 : 0, roundBottom ? 8 : 0));
  TL_ERA_SEGS.forEach((seg, i) => {
    const a = Math.max(xScale(seg.s), left), b = Math.min(xScale(seg.e), right);
    if (b <= a) return;
    if (i % 2 === 1) {
      svg.append('rect').attr('class', 'tl-band-alt')
        .attr('x', a).attr('y', top + 1).attr('width', b - a).attr('height', Math.max(0, bottom - top - 2));
    }
    if (a > left) {
      svg.append('line').attr('class', 'tl-band-sep')
        .attr('x1', a).attr('y1', top + 1).attr('x2', a).attr('y2', bottom - 1);
    }
    if (eraLabelY != null && b - a >= seg.label.length * 13 + 8) {
      svg.append('text').attr('class', 'tl-era-label')
        .attr('x', (a + b) / 2).attr('y', eraLabelY).attr('text-anchor', 'middle')
        .text(seg.label);
    }
  });
}

// Fixed head: era labels, axis ticks and the period strip. Returns its height.
function renderTimelineHead(W, xScale, start, end, periodLayout) {
  const axisY = TL_HEAD_ERA_H + TL_HEAD_AXIS_H;
  const headH = axisY + 4 + periodStripHeight(periodLayout);
  const svg = d3.select('#timeline-head-svg').attr('height', headH);
  svg.selectAll('*').remove();
  drawTimelineSection(svg, xScale, W, 2, headH, true, false, 16);
  drawPeriodTints(svg, periodLayout, 3, headH);
  svg.append('line').attr('class', 'tl-axis')
    .attr('x1', TL_LEFT).attr('y1', axisY).attr('x2', W - TL_RIGHT).attr('y2', axisY);
  const ticks = niceTicks(start, end, (W - TL_LEFT - TL_RIGHT) / Math.max(1, end - start));
  ticks.forEach(t => {
    const x = xScale(t);
    if (x < TL_LEFT || x > W - TL_RIGHT) return;
    svg.append('line').attr('class', 'tl-tick')
      .attr('x1', x).attr('y1', axisY - 4).attr('x2', x).attr('y2', axisY);
    svg.append('text').attr('class', 'tl-tick-label')
      .attr('x', x).attr('y', axisY - 7)
      .attr('text-anchor', x < TL_LEFT + 18 ? 'start' : x > W - TL_RIGHT - 18 ? 'end' : 'middle')
      .text(tickLabel(t));
  });
  drawPeriodStrip(svg, periodLayout, axisY + 4);
  return { headH, ticks };
}

// Body background shared by both views: plot surface, era bands, tints, grid.
function renderTimelineBody(W, xScale, bodyH, ticks, periodLayout) {
  const svg = d3.select('#timeline-svg').attr('height', bodyH);
  svg.selectAll('*').remove();
  drawTimelineSection(svg, xScale, W, 0, bodyH - 2, false, true, null);
  drawPeriodTints(svg, periodLayout, 1, bodyH - 3);
  ticks.forEach(t => {
    const x = xScale(t);
    if (x < TL_LEFT || x > W - TL_RIGHT) return;
    svg.append('line').attr('class', 'tl-grid')
      .attr('x1', x).attr('y1', 1).attr('x2', x).attr('y2', bodyH - 3);
  });
  return svg;
}

function timelinePeriodLayout(start, end, xScale) {
  return periodsVisible
    ? layoutPeriods(allPeriods(), start, end, xScale, periodMaxRows(start, end))
    : { items: [], rows: 0 };
}

function formatYear(y) {

// Bump after replacing same-URL portraits on our image host.
const PORTRAIT_VERSION = '20261102';
const PORTRAIT_STORAGE_KEY = `the100:portrait-refresh:${PORTRAIT_VERSION}`;
const portraitVersions = new Map();
try {
  const saved = JSON.parse(localStorage.getItem(PORTRAIT_STORAGE_KEY) || '{}');
  for (const [url, version] of Object.entries(saved)) {
    if (typeof version === 'string' && /^[a-z0-9-]{1,80}$/i.test(version)) portraitVersions.set(url, version);
  }
} catch { /* Refresh still works when storage is unavailable. */ }
let portraitRefreshCount = 0;
const portraitPeople = new WeakMap();
const portraitRecords = new Map();
let portraitSettingsRevision = 0;

function canRefreshPortrait(url) {
  return url.origin === 'https://docs.suphy.top' && url.pathname.startsWith('/file/');
}
function getPortraitURL(person) {
  let url;
  try { url = new URL(person.img); } catch { return null; }
  if (!['https:', 'http:'].includes(url.protocol)) return null;
  if (canRefreshPortrait(url)) {
    const version = portraitVersions.get(person.img);
    if (version) url.searchParams.set('v', version);
    else if (!url.searchParams.has('v')) url.searchParams.set('v', PORTRAIT_VERSION);
  }
  return url;
}
function refreshPortrait(person) {
  if (!person) return;
  const url = getPortraitURL(person);
  if (!url || !canRefreshPortrait(url)) return;
  const version = `manual-${Date.now().toString(36)}-${++portraitRefreshCount}-${Math.random().toString(36).slice(2, 10)}`;
  portraitVersions.set(person.img, version);
  try {
    localStorage.setItem(PORTRAIT_STORAGE_KEY, JSON.stringify(Object.fromEntries(portraitVersions)));
  } catch { /* Keep the new version for this page even if storage is full or blocked. */ }
  document.querySelectorAll('.person-portrait').forEach(container => {
    const displayed = portraitPeople.get(container);
    if (displayed?.img === person.img) renderPortrait(container, displayed);
  });
  if (portraitDialog.open && currentPortrait?.img === person.img) loadFullPortrait(currentPortrait);

// The site-owned position moves the square along the image's overflow:
// 0 = top/left, 50 = center, 100 = bottom/right. object-fit preserves its ratio.
function normalizePortraitPosition(value) {
  if (!['number', 'string'].includes(typeof value) || String(value).trim() === '') return 50;
  const number = Number(value);
  return Number.isFinite(number) ? Math.max(0, Math.min(100, Math.round(number))) : 50;
}
function portraitPosition(person) {
  if (!person) return 50;
  const record = portraitRecords.get(person.rank);
  return normalizePortraitPosition(record?.image_url === person.img
    ? record.position : PORTRAIT_POSITIONS[person.rank]);
}
function applyPortraitPosition(img, value) {
  const position = normalizePortraitPosition(value);
  img.style.objectPosition = `${position}% ${position}%`;
}
function updateDisplayedPortraitPositions() {
  document.querySelectorAll('.person-portrait').forEach(container => {
    const person = portraitPeople.get(container);
    const img = container.querySelector('img');
    if (person && img) applyPortraitPosition(img, portraitPosition(person));
  });
}
async function loadPortraitPositions() {
  const revision = ++portraitSettingsRevision;
  try {
    const response = await fetch('/api/portrait-positions', { cache: 'no-store' });
    if (!response.ok) return;
    const body = await response.json();
    if (!Array.isArray(body.records) || revision !== portraitSettingsRevision) return;
    portraitRecords.clear();
    for (const record of body.records) {
      if (Number.isInteger(record.rank) && record.rank >= 1 && record.rank <= 100 &&
          typeof record.image_url === 'string') portraitRecords.set(record.rank, record);
    }
    updateDisplayedPortraitPositions();
    if (portraitCropState?.ready && !portraitCropState.dirty && !portraitCropState.saving) {
      portraitCropState.position = portraitPosition(portraitCropState.person);
      paintPortraitCrop();
    }
  } catch { /* Keep the site-owned fallback positions when the API is unavailable. */ }
}

  const size = portraitCropPreview.getBoundingClientRect().width;
  const width = portraitCropImage.naturalWidth, height = portraitCropImage.naturalHeight;
  const horizontal = width > height;
  const overflow = size * (horizontal ? width / height - 1 : height / width - 1);
  portraitCropDrag = { pointerId: e.pointerId, start: horizontal ? e.clientX : e.clientY,

      method: 'PUT', cache: 'no-store',

function parseMD(text) {
  if (!text) return null;
  // Strip YAML frontmatter if present (defensive)
  const noFront = text.replace(/^---[\s\S]*?---\n/, '');
  // Split on --- separators between paragraph groups
  const parts = noFront.split(/\n---\n/).map(s => s.trim()).filter(Boolean);
  // Filter out headings (# or ##, some files use single #)
  const blocks = parts.filter(p => !/^#{1,2}\s/.test(p));
  // Flatten: split each block on blank lines into individual text segments
  const segments = [];
  for (const block of blocks) {
    const segs = block.split(/\n\n/).map(s => s.trim()).filter(Boolean);
    for (const s of segs) segments.push(s);
  }
  // Classify a segment as primarily Chinese (CJK char count > Latin char count)
  function isPrimarilyChinese(s) {
    const cjk = (s.match(/[一-鿿㐀-䶿]/g) || []).length;
    const lat = (s.match(/[a-zA-Z]/g) || []).length;
    return cjk > lat;
  }
  // Pair by language alternation: EN → ZH → EN → ZH …
  const pairs = [];
  let i = 0;
  while (i < segments.length) {
    const cur = segments[i];
    if (!isPrimarilyChinese(cur)) {
      // English segment — look ahead one for its Chinese counterpart
      const next = segments[i + 1];
      if (next && isPrimarilyChinese(next)) {
        pairs.push({ en: cur, zh: next });
        i += 2;
      } else {
        pairs.push({ en: cur, zh: '' });
        i += 1;
      }
    } else {
      // Chinese segment — try to attach to previous pair missing ZH
      if (pairs.length > 0 && !pairs[pairs.length - 1].zh) {
        pairs[pairs.length - 1].zh = cur;
      } else {
        pairs.push({ en: '', zh: cur });
      }
      i += 1;
    }
  }
  return pairs.filter(p => p.en || p.zh);
}

function renderRegionDropdown() {
  const dd = document.getElementById('region-dropdown');
  const activeSubs = regionState.selectedSubs;
  const hasSelection = regionState.mode !== 'all';

  let html = `<label class="reg-item reg-item-all">
    <input type="checkbox" ${!hasSelection ? 'checked' : ''} data-action="all">
    <span>全部地区</span>
  </label>`;

  for (const cont of CONT_ORDER) {
    const subs = CONT_TO_SUBS[cont] || [];
    const allSubsSelected = subs.length > 0 && subs.every(s => activeSubs.has(s));
    const someSelected = subs.some(s => activeSubs.has(s));
    const contSelected = subs.length === 0 ? activeSubs.has(cont) : allSubsSelected;

    html += `<div class="reg-item reg-continent">
      <input type="checkbox" ${contSelected ? 'checked' : ''}
        ${someSelected && !allSubsSelected ? 'class="partial"' : ''}
        data-action="continent" data-cont="${cont}">
      <span>${cont}</span>
    </div>`;

    for (const sub of subs) {
      const reg = REGIONS[sub] || REGIONS[cont] || { color: '#888' };
      const sel = activeSubs.has(sub);
      html += `<label class="reg-item reg-sub">
        <input type="checkbox" ${sel ? 'checked' : ''} data-action="sub" data-sub="${sub}">
        <span class="reg-dot" style="background:${reg.color}"></span>
        <span>${sub}</span>
      </label>`;
    }
  }

  dd.innerHTML = html;
  // Set indeterminate state on continent checkboxes for partial selection
  dd.querySelectorAll('.reg-continent input').forEach(inp => {
    const cont = inp.dataset.cont;
    const subs = CONT_TO_SUBS[cont] || [];
    if (subs.length > 0) {
      const some = subs.some(s => activeSubs.has(s));
      const all = subs.every(s => activeSubs.has(s));
      inp.indeterminate = some && !all;
    }
  });
  updateRegionBadge();
}

function updateRegionBadge() {
  const btn = document.getElementById('region-filter-btn');
  const badge = document.getElementById('region-filter-count');
  if (regionState.mode === 'all') {
    badge.textContent = '全部';
    btn.classList.remove('has-selection');
  } else {
    const n = regionState.selectedSubs.size;
    badge.textContent = n;
    btn.classList.add('has-selection');
  }
}

function initRegionFilter() {
  const btn = document.getElementById('region-filter-btn');
  const dd = document.getElementById('region-dropdown');

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    dd.classList.toggle('hidden');
    if (!dd.classList.contains('hidden')) renderRegionDropdown();
  });

  dd.addEventListener('click', (e) => {
    const inp = e.target.closest('input[type="checkbox"]');
    if (!inp) return;
    const action = inp.dataset.action;

    if (action === 'all') {
      regionState.selectedSubs.clear();
      regionState.mode = 'all';
    } else if (action === 'continent') {
      const cont = inp.dataset.cont;
      const subs = CONT_TO_SUBS[cont] || [];
      if (subs.length === 0) {
        // Continent with no subregions — toggle the continent itself
        if (regionState.selectedSubs.has(cont)) {
          regionState.selectedSubs.delete(cont);
        } else {
          regionState.selectedSubs.add(cont);
        }
      } else {
        const allSel = subs.every(s => regionState.selectedSubs.has(s));
        if (allSel) {
          for (const s of subs) regionState.selectedSubs.delete(s);
        } else {
          for (const s of subs) regionState.selectedSubs.add(s);
        }
      }
      regionState.mode = regionState.selectedSubs.size > 0 ? 'partial' : 'all';
    } else if (action === 'sub') {
      const sub = inp.dataset.sub;
      if (regionState.selectedSubs.has(sub)) {
        regionState.selectedSubs.delete(sub);
      } else {
        regionState.selectedSubs.add(sub);
      }
      regionState.mode = regionState.selectedSubs.size > 0 ? 'partial' : 'all';
    }

    applyRegionEmphasis();
    renderRegionDropdown();
  });

  document.addEventListener('click', (e) => {
    if (!document.getElementById('region-filter').contains(e.target)) {
      dd.classList.add('hidden');
    }
  });
}

// ═══════════════════════════════════════════════════════════
// MAP
// ═══════════════════════════════════════════════════════════

const MAP_W_K = 0.175, MAP_H_K = 0.318;  // Natural Earth 1: scale↔dimension ratios

function getMapDims() {
  const el = document.getElementById('map-svg');
  return { W: el.clientWidth || window.innerWidth, H: el.clientHeight || 400 };
}

function computeScale(mode, W, H) {
  // scale/width ≈ MAP_W_K, scale/height ≈ MAP_H_K
  if (mode === 'width')  return W * MAP_W_K;
  if (mode === 'height') return H * MAP_H_K;
  return Math.min(W * MAP_W_K, H * MAP_H_K);  // auto: fit all
}

function getMapAvailableWidth(W) {
  const panel = document.getElementById('detail-panel');
  if (window.matchMedia('(max-width: 600px)').matches || !panel.classList.contains('open')) return W;
  return Math.max(1, W - Math.min(400, panel.getBoundingClientRect().width));
}

// Content size (px) the projected map occupies at a given scale.
function mapContentSize(scale) {
  return { mw: scale / MAP_W_K, mh: scale / MAP_H_K };
}

// Clamp pan so the map can't be dragged/scrolled past its own edges.
// Use the same available viewport as the projection and zoom center.
function clampPan(scale, availW, H) {
  const { mw, mh } = mapContentSize(scale);
  const overX = (mw - availW) / 2;
  const overY = (mh - H) / 2;
  userPanX = overX > 0 ? Math.max(-overX, Math.min(overX, userPanX)) : 0;
  userPanY = overY > 0 ? Math.max(-overY, Math.min(overY, userPanY)) : 0;
}

function redrawMap() {
  if (!worldData || !projection) return;
  const { W, H } = getMapDims();
  const availW = getMapAvailableWidth(W);

  const baseScale = computeScale(fitMode, availW, H);
  const zk = fitMode === 'auto' ? userZoom : 1;
  const scale = baseScale * zk;

  clampPan(scale, availW, H);
  const tx = availW / 2 + userPanX;
  const ty = H / 2 + userPanY;

  projection.scale(scale).translate([tx, ty]);
  geoPath = d3.geoPath().projection(projection);

  mapSvg.select('.sphere').attr('d', geoPath({ type: 'Sphere' }));
  mapSvg.select('.graticule').attr('d', geoPath(d3.geoGraticule()()));
  mapSvg.selectAll('.country').attr('d', geoPath);

  // Reproject persons
  PERSONS.forEach(d => {
    const pt = projection([d.birth_lng, d.birth_lat]);
    d._x = pt ? pt[0] : null;
    d._y = pt ? pt[1] : null;
  });
  mapSvg.selectAll('.person-dot')
    .attr('cx', d => d._x)
    .attr('cy', d => d._y)
    .attr('visibility', d => d._x ? 'visible' : 'hidden');
  mapSvg.selectAll('.person-label')
    .attr('x', d => d._x)
    .attr('y', d => d._y);
}

// ── Map interaction: wheel zoom + drag pan ──────────────────
function setupMapInteraction(svgEl) {
  let dragSX = 0, dragSY = 0, startPX = 0, startPY = 0;

  svgEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const { W, H } = getMapDims();
    const availW = getMapAvailableWidth(W);
    if (fitMode === 'auto') {
      // Auto: wheel zooms toward the cursor (floor = original size).
      const delta = e.deltaY > 0 ? 0.88 : 1.14;
      const newZ = Math.max(1, Math.min(8, userZoom * delta));
      if (newZ === userZoom) return;

      const rect = svgEl.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const cx = availW / 2, cy = H / 2;
      const ratio = newZ / userZoom;
      // Keep the geographic point under the cursor fixed.
      userPanX = mx - (mx - cx - userPanX) * ratio - cx;
      userPanY = my - (my - cy - userPanY) * ratio - cy;
      userZoom = newZ;
    } else {
      // Width/height fill: wheel scrolls along the overflowing axis so the
      // clipped portion of the map can be reached. clampPan() bounds it.
      if (fitMode === 'width') userPanY -= e.deltaY;
      else                     userPanX -= e.deltaY;
    }
    redrawMap();
  }, { passive: false });

  const pointers = new Map();
  let pinchDistance = 0, pinchZoom = 1, moved = false;
  const distance = () => {
    const points = [...pointers.values()];
    return Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
  };
  svgEl.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragSX = e.clientX; dragSY = e.clientY;
      startPX = userPanX; startPY = userPanY; moved = false;
    } else if (pointers.size === 2) {
      pinchDistance = distance(); pinchZoom = userZoom; moved = true;
    }
  });
  svgEl.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      if (fitMode === 'auto' && pinchDistance > 0)
        userZoom = Math.max(1, Math.min(8, pinchZoom * distance() / pinchDistance));
    } else if (pointers.size === 1) {
      if (Math.hypot(e.clientX - dragSX, e.clientY - dragSY) < 5 && !moved) return;
      moved = true;
      svgEl.setPointerCapture(e.pointerId);
      userPanX = startPX + e.clientX - dragSX;
      userPanY = startPY + e.clientY - dragSY;
    }
    redrawMap();
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      const point = [...pointers.values()][0];
      dragSX = point.x; dragSY = point.y;
      startPX = userPanX; startPY = userPanY;
    }
  }
  svgEl.addEventListener('pointerup', endPointer);
  svgEl.addEventListener('pointercancel', endPointer);
  svgEl.addEventListener('pointerleave', e => {
    if (!svgEl.hasPointerCapture(e.pointerId)) endPointer(e);
  });
  svgEl.addEventListener('click', e => {
    if (moved) { e.preventDefault(); e.stopImmediatePropagation(); moved = false; }
  }, true);
  svgEl.addEventListener('dblclick', resetMapZoom);
}

function resetMapZoom() {
  userZoom = 1; userPanX = 0; userPanY = 0;
  redrawMap();
}

async function buildMap() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const loaded = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json', { signal: controller.signal });
    worldData = loaded;
  } finally { clearTimeout(timeout); }
  const { W, H } = getMapDims();
  projection = d3.geoNaturalEarth1();
  geoPath = d3.geoPath().projection(projection);
  mapSvg = d3.select('#map-svg');

  mapSvg.append('path').attr('class', 'sphere');
  mapSvg.append('path').attr('class', 'graticule');

  const countries = topojson.feature(worldData, worldData.objects.countries);

  // Resolve each polygon's region from the (now complete) COUNTRIES table.
  // Unknown countries stay untagged so they are never wrongly highlighted.
  // Disputed territories have no ISO numeric id in world-atlas, so they can
  // only be matched by polygon name. Tag them like their surrounding region.
  const NAME_REGION = {
    'Kosovo':     { sr: '南欧', ct: '欧洲' },
    'N. Cyprus':  { sr: '西亚', ct: '亚洲' },
    'Somaliland': { sr: '东非', ct: '非洲' },
  };

  function countryRegion(d) {
    // world-atlas ids are zero-padded 3-digit strings ("040", "008"); the
    // ISO_NUM_TO_A2 keys are unpadded ("40", "8"). Normalize before lookup.
    const c = COUNTRIES[ISO_NUM_TO_A2[String(parseInt(d.id, 10))] || ''];
    if (!c) return NAME_REGION[d.properties && d.properties.name] || { sr: '', ct: '' };
    return { sr: c.subregion || '', ct: c.continent || SUB_TO_CONT[c.subregion] || '' };
  }

  mapSvg.append('g').selectAll('path')
    .data(countries.features).join('path')
    .attr('class', 'country')
    .attr('data-subregion', d => countryRegion(d).sr)
    .attr('data-continent', d => countryRegion(d).ct);

  // Tag person dots with region data for filtering
  PERSONS.forEach(p => {
    p._subregion = p.region;
    p._continent = SUB_TO_CONT[p.region] || '';
  });

  const dotsG = mapSvg.append('g').attr('class', 'persons-layer');

  PERSONS.forEach(d => { d._baseOpacity = 0.85; });

  dotsG.selectAll('.person-dot')
    .data(PERSONS).join('circle')
    .attr('class', 'person-dot')
    .attr('r', d => dotR(d))
    .attr('fill', d => nodeColor(d))
    .attr('stroke', '#0a0d13').attr('stroke-width', 1.5)
    .attr('opacity', 0.85)
    .on('mouseover', (evt, d) => showTooltip(evt, d))
    .on('mousemove', moveTip)
    .on('mouseout', hideTip)
    .on('click', (evt, d) => { evt.stopPropagation(); openDetail(d); });

  dotsG.selectAll('.person-label')
    .data(PERSONS.filter(d => d.rank <= 10)).join('text')
    .attr('class', 'person-label')
    .attr('pointer-events', 'none')
    .text(d => d.rank);

  mapSvg.on('click', closeDetail);

  redrawMap();

  // ResizeObserver
  new ResizeObserver(() => {
    userZoom = 1; userPanX = 0; userPanY = 0;
    redrawMap();
  }).observe(document.getElementById('map-container'));

  // Map zoom/pan interaction
  setupMapInteraction(document.getElementById('map-svg'));

  enablePersonKeyboard();
  applyAllFilters();
  applyRegionEmphasis();
}

// ── Unified filter (domain + region) ───────────────────────
function applyAllFilters() {
  const domainMatch = d => activeDomain === 'all' || d.domain === activeDomain;
  const activeSubs = activeSubregions();
  const regionMatch = d => {
    if (!activeSubs) return true; // no region filter active
    return activeSubs.has(d._subregion) || activeSubs.has(d._continent);
  };
  // Time-range filter: person's lifespan must overlap with current tlState range
  const timeMatch = d => d.death >= tlState.start && d.birth <= tlState.end;

  d3.selectAll('.person-dot')
    .attr('tabindex', d => domainMatch(d) && regionMatch(d) && timeMatch(d) ? 0 : -1)
    .transition().duration(400)
    .attr('opacity', d => {
      if (activeRank && d.rank !== activeRank) return 0.25;
      return (domainMatch(d) && regionMatch(d) && timeMatch(d)) ? 0.85 : 0.06;
    })
    .attr('pointer-events', d => (domainMatch(d) && regionMatch(d) && timeMatch(d)) ? 'auto' : 'none');
  d3.selectAll('.tl-dot,.tl-bar')
    .attr('tabindex', d => (!activeRank || d.rank === activeRank) && domainMatch(d) && regionMatch(d) ? 0 : -1)
    .transition().duration(400)
    .attr('opacity', d => {
      if (activeRank && d.rank !== activeRank) return 0.12;
      return (domainMatch(d) && regionMatch(d)) ? 0.9 : 0.04;
    })
    .attr('pointer-events', d => {
      if (activeRank && d.rank !== activeRank) return 'none';
      return (domainMatch(d) && regionMatch(d)) ? 'auto' : 'none';
    });
}

// ── Region map emphasis ────────────────────────────────────
// Neutral style for unmapped territories; known countries always show their region.
const COUNTRY_BASE = { fill: '#1b2436', opacity: 1, stroke: '#2a3550', strokeWidth: 0.4 };

function isCountryActive(el, activeSubs) {
  return activeSubs.has(el.dataset.subregion) || activeSubs.has(el.dataset.continent);
}

function countryFill(el, activeSubs) {
  const { subregion, continent } = el.dataset;
  if (!subregion && !continent) return COUNTRY_BASE.fill;
  // Darken the existing swatches so person dots remain legible on the map.
  const shade = !activeSubs ? -0.58 : isCountryActive(el, activeSubs) ? -0.3 : -0.8;
  return lightenColor(regionColor(subregion, continent), shade);
}

function applyRegionEmphasis() {
  const activeSubs = activeSubregions();
  const sel = d3.selectAll('.country').transition().duration(600);

  // NOTE: the `.country` CSS rule sets fill/stroke, which override SVG
  // presentation attributes — so these must be applied as inline styles
  // (via .style) to take effect, not as attributes.
  // Filtering emphasizes selected regions while retaining the color families
  // of the other continents. Clearing the filter restores all region colors.
  sel.style('fill', function() { return countryFill(this, activeSubs); })
    .style('opacity', COUNTRY_BASE.opacity)
    .style('stroke', function() {
      if (!activeSubs || !isCountryActive(this, activeSubs)) return COUNTRY_BASE.stroke;
      return regionColor(this.dataset.subregion, this.dataset.continent);
    })
    .style('stroke-width', function() {
      return activeSubs && isCountryActive(this, activeSubs) ? 0.9 : COUNTRY_BASE.strokeWidth;
    });

  // Also apply to person dots
  applyAllFilters();
}

// ═══════════════════════════════════════════════════════════
// TIMELINE
// ═══════════════════════════════════════════════════════════

function isLifelineMode(start, end) {
  return (end - start) <= LIFELINE_MAX_SPAN;
}

// Greedy row assignment for lifeline bars, in pixels: a bar's footprint includes
// its name when the name has to sit outside a short bar.
const TL_BAR_LABEL_PAD = 10;
function lifelineExtent(p, xScale, start, end) {
  const x1 = xScale(Math.max(p.birth, start));
  const barW = Math.max(xScale(Math.min(p.death, end)) - x1, 2);
  const labelW = periodLabelWidth(p.zh);
  const inside = barW >= labelW + TL_BAR_LABEL_PAD;
  return { x1, barW, inside, right: x1 + barW + (inside ? 0 : labelW + 6) };
}
function assignRows(persons, xScale, start, end) {
  const sorted = [...persons].sort((a, b) => a.birth - b.birth);
  const rowEnd = [];
  return sorted.map(p => {
    const ext = lifelineExtent(p, xScale, start, end);
    let row = rowEnd.findIndex(e => e + 4 <= ext.x1);
    if (row === -1) { row = rowEnd.length; rowEnd.push(ext.right); }
    else rowEnd[row] = ext.right;
    return { ...p, row, _ext: ext };
  });
}

function buildTimeline() {
  // Era buttons — dual-selection aware
  document.querySelectorAll('.era-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const era = btn.dataset.era;

      if (era === 'all') {
        // Reset to full range
        eraFirst = null;
        eraSecond = null;
        tlState.era = 'all';
        tlState.start = ERA_DEFS.all.start;
        tlState.end = ERA_DEFS.all.end;
      } else if (eraFirst === null) {
        // First selection → single era
        eraFirst = era;
        eraSecond = null;
        tlState.era = era;
        tlState.start = ERA_DEFS[era].start;
        tlState.end = ERA_DEFS[era].end;
      } else if (eraSecond === null && era !== eraFirst) {
        // Second selection → form range (chronological order, not click order)
        eraSecond = era;
        const i1 = ERA_ORDER.indexOf(eraFirst);
        const i2 = ERA_ORDER.indexOf(eraSecond);
        const lo = Math.min(i1, i2);  // earlier in time = start
        const hi = Math.max(i1, i2);  // later in time = end
        tlState.era = 'custom';
        tlState.start = ERA_DEFS[ERA_ORDER[lo]].start;
        tlState.end   = ERA_DEFS[ERA_ORDER[hi]].end;
      } else {
        // Third click → restart single selection
        eraFirst = era;
        eraSecond = null;
        tlState.era = era;
        tlState.start = ERA_DEFS[era].start;
        tlState.end = ERA_DEFS[era].end;
      }

      // Fine-tune year inputs: show only for single-era with fineTune
      const yr = document.getElementById('yr-range');
      const isDual = !!(eraFirst && eraSecond);
      if (isDual) {
        yr.style.display = 'none';
      } else if (era !== 'all') {
        const def = ERA_DEFS[era];
        yr.style.display = def.fineTune ? 'flex' : 'none';
        if (def.fineTune) {
          document.getElementById('yr-start').value = tlState.start;
          document.getElementById('yr-end').value = tlState.end;
        }
      } else {
        yr.style.display = 'none';
      }

      updateEraButtons();
      renderTimeline();
      applyAllFilters();
    });
  });

  document.getElementById('yr-apply').addEventListener('click', () => {
    const s = parseInt(document.getElementById('yr-start').value, 10);
    const e = parseInt(document.getElementById('yr-end').value, 10);
    if (!isNaN(s) && !isNaN(e) && s < e) {
      tlState.start = s; tlState.end = e; tlState.era = 'custom';
      // Using fine-tune clears dual selection
      eraFirst = null; eraSecond = null;
      updateEraButtons();
      renderTimeline();
    }
  });

  // ── Update era button visual states ─────────────────────────
  function updateEraButtons() {
    const isDual = !!(eraFirst && eraSecond);
    const chronoStart = isDual ? ERA_ORDER[Math.min(ERA_ORDER.indexOf(eraFirst), ERA_ORDER.indexOf(eraSecond))] : null;
    const chronoEnd   = isDual ? ERA_ORDER[Math.max(ERA_ORDER.indexOf(eraFirst), ERA_ORDER.indexOf(eraSecond))] : null;
    const singleEra = (!isDual && eraFirst) ? eraFirst : null;

    document.querySelectorAll('.era-btn').forEach(b => {
      const e = b.dataset.era;
      b.classList.remove('active', 'range-start', 'range-end', 'range-mid');

      if (e === 'all') {
        // "全部" active only when nothing selected
        b.classList.toggle('active', !eraFirst && tlState.era === 'all');
      } else if (isDual) {
        if (e === chronoStart) {
          b.classList.add('range-start');
        } else if (e === chronoEnd) {
          b.classList.add('range-end');
        } else if (ERA_ORDER.indexOf(e) > ERA_ORDER.indexOf(chronoStart) && ERA_ORDER.indexOf(e) < ERA_ORDER.indexOf(chronoEnd)) {
          b.classList.add('range-mid');
        }
      } else if (e === singleEra) {
        b.classList.add('active');
      }
    });
  }

  refreshEraButtons = updateEraButtons;

  // Drag the top edge (or use ↑/↓) to resize the timeline; double-click resets.
  const tlBox = document.getElementById('timeline');
  const handle = document.getElementById('tl-resize-handle');
  let drag = null, frame = 0;
  const currentHeight = () => parseFloat(tlBox.style.height) || tlBox.getBoundingClientRect().height;
  const setHeight = h => {
    tlUserHeight = Math.round(h);
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => {
      renderTimeline();
      handle.setAttribute('aria-valuenow', String(Math.round(currentHeight())));
    });
  };
  const saveHeight = () => {
    if (tlUserHeight != null) tlUserHeight = Math.round(currentHeight());  // store the clamped value
    try {
      if (tlUserHeight == null) localStorage.removeItem(TL_HEIGHT_KEY);
      else localStorage.setItem(TL_HEIGHT_KEY, String(tlUserHeight));
    } catch {}
  };
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    e.preventDefault();
    drag = { y: e.clientY, h: currentHeight(), id: e.pointerId };
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing-timeline');
    hideTip(true);
  });
  handle.addEventListener('pointermove', e => {
    if (drag && e.pointerId === drag.id) setHeight(drag.h + drag.y - e.clientY);
  });
  const endDrag = () => {
    if (!drag) return;
    drag = null;
    document.body.classList.remove('resizing-timeline');
    requestAnimationFrame(saveHeight);
  };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => handle.addEventListener(type, endDrag));
  handle.addEventListener('dblclick', () => { tlUserHeight = null; saveHeight(); renderTimeline(); });
  handle.addEventListener('keydown', e => {
    const step = e.shiftKey ? 80 : 24;
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
      e.preventDefault();
      setHeight(currentHeight() + (e.key === 'ArrowUp' ? step : -step));
      requestAnimationFrame(() => requestAnimationFrame(saveHeight));
    } else if (e.key === 'Home' || e.key === 'Enter') {
      e.preventDefault();
      tlUserHeight = null; saveHeight(); renderTimeline();
    }
  });

  // Auxiliary period toggle and legend
  const toggle = document.getElementById('period-toggle');
  const legend = document.getElementById('period-legend');
  if (typeof PERIOD_CATEGORIES !== 'undefined') {
    legend.innerHTML = Object.values(PERIOD_CATEGORIES)
      .map(c => `<span><i style="background:${c.color}"></i>${c.zh}</span>`).join('');
  }
  const syncToggle = () => {
    toggle.setAttribute('aria-pressed', String(periodsVisible));
    legend.hidden = !periodsVisible;
  };
  syncToggle();
  toggle.addEventListener('click', () => {
    periodsVisible = !periodsVisible;
    try { localStorage.setItem('the100:periods', periodsVisible ? 'on' : 'off'); } catch {}
    syncToggle();
    hideTip(true);
    renderTimeline();
  });

  renderTimeline();
}

function renderTimeline() {
  const { start, end } = tlState;
  const lifeline = isLifelineMode(start, end);
  const inView = PERSONS.filter(p => p.death >= start && p.birth <= end);
  const wrap = document.getElementById('tl-svg-wrap');
  const tlEl = document.getElementById('timeline-svg');
  const W = tlEl.parentElement.clientWidth || window.innerWidth;

  document.getElementById('tl-mode-info').textContent =
    lifeline ? `生平线视图 · ${inView.length} 人` : `时间点视图 · ${inView.length} 人`;

  if (lifeline) {
    renderLifeline(inView, start, end, W);
  } else {
    renderDots(inView, start, end, W);
  }
  applyAllFilters();
  enablePersonKeyboard();
}

// ── Dot mode ────────────────────────────────────────────────
function renderDots(persons, start, end, W) {
  // No domain label column: the full width goes to the dots so they overlap less.
  // Lanes stay color-coded by domain.
  const xScale = d3.scaleLinear().domain([start, end]).range([TL_LEFT, W - TL_RIGHT]);
  const periodLayout = timelinePeriodLayout(start, end, xScale);
  const { headH, ticks } = renderTimelineHead(W, xScale, start, end, periodLayout);
  const { total, bodyH } = resolveTimelineHeight(headH, TL_HEIGHT_DOT);
  document.getElementById('timeline').style.height = total + 'px';
  const svg = renderTimelineBody(W, xScale, bodyH, ticks, periodLayout);

  // Fixed domain lanes fill the body: each person's vertical position stays
  // stable across time ranges, domain filters, and person color modes.
  const laneTop = 4, laneBottom = bodyH - 6;
  const rowH = (laneBottom - laneTop) / TL_DOMAIN_ORDER.length;
  TL_DOMAIN_ORDER.forEach((domain, row) => {
    const y = laneTop + row * rowH + rowH / 2;
    svg.append('line').attr('class', 'tl-lane')
      .attr('x1', TL_LEFT).attr('y1', y).attr('x2', W - TL_RIGHT).attr('y2', y)
      .attr('stroke', DOMAIN_LABELS[domain].color);
  });
  const sorted = [...persons].sort((a, b) => a.birth - b.birth);
  sorted.forEach(d => {
    const row = TL_DOMAIN_ORDER.indexOf(d.domain);
    d._tlx = xScale(d.birth);
    d._tly = laneTop + row * rowH + rowH / 2;
  });

  svg.selectAll('.tl-dot').data(sorted).join('circle')
    .attr('class', 'tl-dot')
    .attr('cx', d => d._tlx).attr('cy', d => d._tly)
    .attr('r', 4)
    .attr('fill', d => nodeColor(d))
    .attr('stroke', '#0a0d13').attr('stroke-width', 1)
    .attr('opacity', 0.92)
    .on('mouseover', (evt, d) => showTooltip(evt, d))
    .on('mousemove', moveTip)
    .on('mouseout', hideTip)
    .on('click', (evt, d) => { evt.stopPropagation(); openDetail(d); });
}

// ── Lifeline mode ────────────────────────────────────────────
function renderLifeline(persons, start, end, W) {
  const xScale = d3.scaleLinear().domain([start, end]).range([TL_LEFT, W - TL_RIGHT]);
  const withRows = assignRows(persons, xScale, start, end);
  const numRows = withRows.length ? Math.max(...withRows.map(d => d.row)) + 1 : 0;
  const periodLayout = timelinePeriodLayout(start, end, xScale);
  const { headH, ticks } = renderTimelineHead(W, xScale, start, end, periodLayout);
  const topPad = 6;
  const contentH = topPad + numRows * TL_ROW_H + 8;
  const { total, bodyH } = resolveTimelineHeight(headH, Math.min(contentH, TL_MAX_H));
  document.getElementById('timeline').style.height = total + 'px';
  // The body scrolls when bars need more room than the visible height.
  const svg = renderTimelineBody(W, xScale, Math.max(contentH, bodyH), ticks, periodLayout);

  const barH = 14;
  withRows.forEach(d => {
    const rowY = topPad + d.row * TL_ROW_H;
    d._tlx = d._ext.x1;
    d._barW = d._ext.barW;
    d._barY = rowY + (TL_ROW_H - barH) / 2;
    d._tly = d._barY + barH / 2;
    if (d.row > 0) {
      svg.append('line').attr('class', 'tl-row-sep')
        .attr('x1', TL_LEFT).attr('y1', rowY - 1)
        .attr('x2', W - TL_RIGHT).attr('y2', rowY - 1);
    }
  });

  svg.selectAll('.tl-bar').data(withRows).join('rect')
    .attr('class', 'tl-bar')
    .attr('x', d => d._tlx)
    .attr('y', d => d._barY)
    .attr('width', d => d._barW)
    .attr('height', barH)
    .attr('rx', 3.5)
    .attr('fill', d => nodeColor(d))
    .attr('opacity', 0.82)
    .on('mouseover', (evt, d) => showTooltip(evt, d))
    .on('mousemove', moveTip)
    .on('mouseout', hideTip)
    .on('click', (evt, d) => { evt.stopPropagation(); openDetail(d); });

  // Birth tick marks
  withRows.forEach(d => {
    if (d.birth >= start) {
      svg.append('line')
        .attr('x1', d._tlx).attr('y1', d._barY - 1)
        .attr('x2', d._tlx).attr('y2', d._barY + barH + 1)
        .attr('stroke', '#fff').attr('stroke-width', 1).attr('opacity', 0.4)
        .attr('pointer-events', 'none');
    }
  });

  // Names: inside the bar when they fit, otherwise just to its right
  // (row packing already reserved that space).
  withRows.forEach(d => {
    const y = d._barY + barH / 2;
    if (d._ext.inside) {
      svg.append('text').attr('class', 'tl-bar-label')
        .attr('x', d._tlx + 6).attr('y', y)
        .attr('dominant-baseline', 'middle')
        .text(d.zh);
    } else if (d._tlx + d._barW + 4 < W - TL_RIGHT - 20) {
      svg.append('text').attr('class', 'tl-bar-label-out')
        .attr('x', d._tlx + d._barW + 4).attr('y', y)
        .attr('dominant-baseline', 'middle')
        .text(d.zh);
    }
  });

  // Small rank number on wide bars of the top 20
  withRows.forEach(d => {
    if (d.rank <= 20 && d._ext.inside && d._barW >= periodLabelWidth(d.zh) + 34) {
      svg.append('text').attr('class', 'tl-bar-rank')
        .attr('x', d._tlx + d._barW - 5).attr('y', d._barY + barH / 2)
        .attr('dominant-baseline', 'middle').attr('text-anchor', 'end')
        .text(`#${d.rank}`);
    }
  });

  // Sync active state
  if (activeRank) {
    d3.selectAll('.tl-bar')
      .attr('opacity', d => d.rank === activeRank ? 1 : 0.15);
  }
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════

function enablePersonKeyboard() {
  d3.selectAll('.person-dot,.tl-dot,.tl-bar')
    .attr('role', 'button')
    .attr('aria-label', d => '#' + d.rank + ' ' + d.zh + ' ' + d.en)
    .on('keydown', (evt, d) => {
      if (evt.key === 'Enter' || evt.key === ' ') {
        evt.preventDefault(); openDetail(d);
      }
    });
}
function initControls() {
  // Domain filter buttons
  document.querySelectorAll('.filter-btn[data-filter="domain"]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeDomain = btn.dataset.value;
      document.querySelectorAll('.filter-btn[data-filter="domain"]')
        .forEach(b => b.classList.toggle('active', b === btn));
      applyAllFilters();
    });
  });

  // Fit buttons
  document.querySelectorAll('#map-fit-btns .fit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      fitMode = btn.dataset.mode;
      document.querySelectorAll('#map-fit-btns .fit-btn').forEach(b => b.classList.toggle('active', b === btn));
      resetMapZoom();
    });
  });

  // Color-mode buttons (区域 / 领域 / 角色)
  document.querySelectorAll('#map-color-btns .fit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      colorMode = btn.dataset.color;
      document.querySelectorAll('#map-color-btns .fit-btn').forEach(b => b.classList.toggle('active', b === btn));
      d3.selectAll('.person-dot').attr('fill', d => nodeColor(d));
      renderTimeline();
    });
  });


  buildTimeline();
  initRegionFilter();
}
let mapLoading = false;
async function loadMap() {
  if (mapLoading) return;
  mapLoading = true;
  const retry = document.getElementById('map-retry');
  retry.disabled = true;
  try {
    await buildMap();
    document.getElementById('map-error').hidden = true;
  } catch (error) {
    worldData = null;
    document.getElementById('map-error').hidden = false;
    console.error('Map initialization failed', error);
  } finally {
    document.getElementById('loading').style.display = 'none';
    mapLoading = false;
    retry.disabled = false;
  }
}
initControls();
document.getElementById('map-retry').addEventListener('click', loadMap);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !portraitDialog.open && !portraitCropDialog.open) closeDetail();
});
loadMap();
loadPortraitPositions();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadPortraitPositions();
});

window.addEventListener('resize', () => {
  stopDetailResize();
  setDetailWidth();
  clearTimeout(window._resizeTL);
  window._resizeTL = setTimeout(() => renderTimeline(), 150);
});
</script>
